<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a6f97" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scratchboard" />
    <title>Scratchboard</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg?v=conceptA5" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png?v=conceptA5" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=conceptA5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css?v=image1" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <canvas id="board"></canvas>

    <aside class="dock dock-bottom" id="dock" aria-label="Drawing tools">
      <button
        type="button"
        id="dockDragHandle"
        class="dock-btn dock-drag-handle"
        title="Drag toolbar to an edge"
        aria-label="Drag toolbar"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="7" r="1.4" fill="currentColor" />
          <circle cx="15" cy="7" r="1.4" fill="currentColor" />
          <circle cx="9" cy="12" r="1.4" fill="currentColor" />
          <circle cx="15" cy="12" r="1.4" fill="currentColor" />
          <circle cx="9" cy="17" r="1.4" fill="currentColor" />
          <circle cx="15" cy="17" r="1.4" fill="currentColor" />
        </svg>
      </button>
      <div class="dock-divider" aria-hidden="true"></div>

      <div class="dock-cluster" role="group" aria-label="Tool">
        <button type="button" id="penBtn" class="dock-btn is-active" data-tool="pen" title="Pen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 20l4.2-1.1L18.5 8.6a2 2 0 0 0 0-2.8l-.3-.3a2 2 0 0 0-2.8 0L5.1 15.8 4 20z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button type="button" id="eraserBtn" class="dock-btn" data-tool="eraser" title="Eraser">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7.5 18.5L4 15l9.2-9.2a2.5 2.5 0 0 1 3.5 0L20 9.1a2.5 2.5 0 0 1 0 3.5L12.2 20.5H7.5zM9 18.5h3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

      <div class="dock-divider" aria-hidden="true"></div>

      <div class="color-group" role="group" aria-label="Pen color" id="colorGroup">
        <button type="button" class="color-swatch is-active" data-color="#1a1a1a" style="--swatch:#1a1a1a" aria-label="Ink"></button>
        <button type="button" class="color-swatch" data-color="#c0392b" style="--swatch:#c0392b" aria-label="Red"></button>
        <button type="button" class="color-swatch" data-color="#2471a3" style="--swatch:#2471a3" aria-label="Blue"></button>
        <button type="button" class="color-swatch" data-color="#1e8449" style="--swatch:#1e8449" aria-label="Green"></button>
        <button type="button" class="color-swatch" data-color="#d68910" style="--swatch:#d68910" aria-label="Amber"></button>
      </div>

      <div class="dock-divider" aria-hidden="true"></div>

      <div class="size-group" role="group" aria-label="Stroke size" id="sizeGroup">
        <button type="button" class="size-swatch" data-size="2" aria-label="Thin">
          <span class="size-dot" style="--dot:0.28rem"></span>
        </button>
        <button type="button" class="size-swatch is-active" data-size="5" aria-label="Medium">
          <span class="size-dot" style="--dot:0.42rem"></span>
        </button>
        <button type="button" class="size-swatch" data-size="10" aria-label="Thick">
          <span class="size-dot" style="--dot:0.62rem"></span>
        </button>
      </div>

      <div class="dock-divider" aria-hidden="true"></div>

      <div class="dock-cluster" role="group" aria-label="History">
        <button type="button" id="undoBtn" class="dock-btn" title="Undo (Ctrl/⌘Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9 14H4v-5M4 9c2.5-3 6-5 10-5a8 8 0 1 1-1 15.9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button type="button" id="redoBtn" class="dock-btn" title="Redo (Ctrl/⌘⇧Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M15 14h5v-5M20 9c-2.5-3-6-5-10-5a8 8 0 1 0 1 15.9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

      <div class="dock-divider" aria-hidden="true"></div>

      <button type="button" id="clearBtn" class="dock-btn dock-clear" title="Clear board" aria-label="Clear board">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M5 7h14M9 7V5h6v2M8 7l1 12h6l1-12"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <div class="dock-divider" aria-hidden="true"></div>

      <button type="button" id="saveBtn" class="dock-btn" title="Save as PNG" aria-label="Save as PNG">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M5 3h11l3 3v15H5V3zM8 3v5h7V3M8 17h8M8 13h8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <div class="dock-divider" aria-hidden="true"></div>

      <button
        type="button"
        id="dockPosBtn"
        class="dock-btn"
        title="Move toolbar (bottom → left → top → right)"
        aria-label="Move toolbar"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect
            x="3.5"
            y="3.5"
            width="17"
            height="17"
            rx="2.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          />
          <path
            d="M8 8h3v3H8zM13 8h3v3h-3zM8 13h3v3H8zM13 13h3v3h-3z"
            fill="currentColor"
            opacity="0.35"
          />
          <path d="M8 8h3v3H8z" fill="currentColor" />
        </svg>
      </button>

      <div class="live" id="liveStatus" title="Connection" role="status" aria-label="Connecting">
        <span id="statusDot" class="live-dot" aria-hidden="true"></span>
      </div>
    </aside>

    <script type="module" src="/app.js?v=image-save4"></script>
  </body>
</html>
